# share.jjanalysis.com — LinkedIn link-preview pages for the 수익률 공유 card.
# See src/index.js for what it does and supabase/share_cards.sql for the data.
#
# Deploy (one time, from this folder):
#   npx wrangler login
#   npx wrangler deploy
# `custom_domain = true` makes Cloudflare create the share.jjanalysis.com DNS
# record and certificate itself; the main jjanalysis.com records are untouched.
name = "jj-share"
main = "src/index.js"
compatibility_date = "2026-10-01"

routes = [
  { pattern = "share.jjanalysis.com", custom_domain = true }
]

