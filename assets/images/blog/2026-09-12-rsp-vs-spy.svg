  <g fill="#1F4E79">
    <circle cx="90" cy="227" r="3"/><circle cx="144" cy="238" r="3"/><circle cx="198" cy="217" r="3"/>
    <circle cx="251" cy="206" r="3"/><circle cx="305" cy="195" r="3"/><circle cx="359" cy="238" r="3"/>
    <circle cx="413" cy="259" r="3"/><circle cx="466" cy="195" r="3"/><circle cx="520" cy="132" r="3"/>
  </g>
  <g fill="#2E8B7A">
