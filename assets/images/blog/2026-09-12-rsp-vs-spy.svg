<svg viewBox="0 0 600 340" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect x="0" y="0" width="600" height="340" fill="#F7F4EE"/>

  <text x="32" y="40" font-size="18" font-weight="700" fill="#1B1F23">S&amp;P500 vs 동일가중지수(RSP), 2026년 흐름</text>
  <text x="32" y="60" font-size="12.5" fill="#6B6F72">지수화(1월=100) 개념도 — 상반기엔 RSP가 앞섰지만 하반기 들어 격차가 좁혀졌다</text>

  <line x1="90" y1="227" x2="520" y2="227" stroke="#D8D3C6" stroke-width="1" stroke-dasharray="3 3"/>
