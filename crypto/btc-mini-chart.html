---
layout: null
---
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BTC Mini Chart</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 10px 12px 6px;
      height: 280px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    #stats {
      display: flex;
      gap: 16px;
      font-size: 0.74rem;
      margin-bottom: 6px;
      flex-shrink: 0;
    }
    #stats .lbl { color: #484f58; }
    #stats .val { color: #e6edf3; font-weight: 600; }
    #stats .up  { color: #3fb950; font-weight: 600; }
    #stats .dn  { color: #f85149; font-weight: 600; }
    #chartWrap {
      position: relative;
      flex: 1;
      min-height: 0;
    }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    #src { font-size: 0.67rem; color: #484f58; margin-top: 4px; flex-shrink: 0; }
  </style>
</head>
<body>
  <div id="stats">
    <span><span class="lbl">BTC </span><span class="val" id="sCur">—</span></span>
    <span><span class="lbl">7d </span><span id="s7d" class="val">—</span></span>
    <span><span class="lbl">30d </span><span id="s30d" class="val">—</span></span>
  </div>
  <div id="chartWrap">
    <canvas id="c"></canvas>
  </div>
  <div id="src">Loading…</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script>
    function sma30(arr) {
      return arr.map((_, i) => {
        if (i < 29) return NaN;
        let s = 0; for (let j = i-29; j <= i; j++) s += arr[j]; return s/30;
      });
    }

    function setStats(prices) {
      const last = prices[prices.length - 1];
      const p7   = prices.length >= 8  ? prices[prices.length - 8]  : null;
      const p30  = prices.length >= 31 ? prices[prices.length - 31] : null;
      document.getElementById('sCur').textContent =
        '$' + last.toLocaleString(undefined, {maximumFractionDigits: 0});
      const set = (id, a, b) => {
        if (!b) return;
        const pct = ((a/b - 1)*100).toFixed(1);
        const el = document.getElementById(id);
        el.textContent = (pct >= 0 ? '+' : '') + pct + '%';
        el.className = pct >= 0 ? 'up' : 'dn';
      };
      set('s7d', last, p7);
      set('s30d', last, p30);
    }

    function renderChart(dates, prices) {
      const n = Math.min(365, dates.length);
      const d = dates.slice(-n);
      const p = prices.slice(-n);
      const ma = sma30(prices).slice(-n);

      setStats(prices);

      new Chart(document.getElementById('c').getContext('2d'), {
        type: 'line',
        data: {
          labels: d,
          datasets: [
            {
              data: p,
              borderColor: '#58a6ff',
              borderWidth: 1.5,
              pointRadius: 0,
              tension: 0,
              fill: true,
              backgroundColor: 'rgba(88,166,255,0.06)',
              label: 'BTC',
            },
            {
              data: ma,
              borderColor: 'rgba(255,152,0,0.75)',
              borderWidth: 1.5,
              borderDash: [4,3],
              pointRadius: 0,
              tension: 0,
              fill: false,
              spanGaps: true,
              label: 'MA-30',
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              mode: 'index', intersect: false,
              backgroundColor: '#1c2128',
              borderColor: '#30363d', borderWidth: 1,
              titleColor: '#e6edf3', bodyColor: '#8b949e',
              padding: 8, displayColors: false,
              callbacks: {
                label: item => {
                  if (isNaN(item.parsed.y)) return null;
                  return item.datasetIndex === 0
                    ? 'BTC: $' + item.parsed.y.toLocaleString(undefined,{maximumFractionDigits:0})
                    : 'MA-30: $' + item.parsed.y.toLocaleString(undefined,{maximumFractionDigits:0});
                }
              }
            }
          },
          scales: {
            x: {
              grid: { color: 'rgba(48,54,61,0.5)' },
              ticks: {
                color: '#484f58',
                font: { size: 9 },
                maxTicksLimit: 7,
                callback: (_, i) => {
                  const dt = d[i];
                  if (!dt) return '';
                  // Show YYYY-MM on first day of each month
                  if (i === 0 || d[i].slice(0,7) !== d[i-1].slice(0,7)) return dt.slice(0,7);
                  return '';
                }
              }
            },
            y: {
              grid: { color: 'rgba(48,54,61,0.5)' },
              ticks: {
                color: '#484f58',
                font: { size: 9 },
                callback: v => '$' + (v >= 1000 ? (v/1000).toFixed(0)+'K' : v)
              }
            }
          }
        }
      });
    }

    async function load() {
      const src = document.getElementById('src');
      let dates = [], prices = [];

      // 1. Try daily CSV
      try {
        const r = await fetch('{{ "/crypto/data/btc_daily.csv" | relative_url }}');
        if (r.ok) {
          const text = await r.text();
          const result = Papa.parse(text.trim(), { header: true, skipEmptyLines: true });
          for (const row of result.data) {
            const d = (row.date || '').trim();
            const p = parseFloat(row.open_price_usd);
            if (d && !isNaN(p) && p > 0) { dates.push(d); prices.push(p); }
          }
          if (dates.length > 0) {
            src.textContent = 'Data: CSV (' + dates[0] + ' ~ ' + dates[dates.length-1] + ')';
          }
        }
      } catch (e) { /* fall through */ }

      // 2. Gap-fill or full fallback via CoinGecko
      try {
        const days = dates.length > 0 ? 30 : 365;
        const r = await fetch(
          'https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=usd&days=' + days + '&interval=daily'
        );
        if (r.ok) {
          const json = await r.json();
          const lastDate = dates.length > 0 ? dates[dates.length-1] : '';
          let appended = 0;
          for (const [ts, price] of json.prices) {
            const dt = new Date(ts);
            const s = dt.getFullYear() + '-'
              + String(dt.getMonth()+1).padStart(2,'0') + '-'
              + String(dt.getDate()).padStart(2,'0');
            if (s > lastDate && price > 0) { dates.push(s); prices.push(price); appended++; }
          }
          if (dates.length > 0 && appended > 0) {
            src.textContent += ' + CoinGecko (last ' + appended + ' days)';
          } else if (dates.length === 0) {
            src.textContent = 'Data: CoinGecko API';
          }
        }
      } catch (e) { /* ignore */ }

      if (prices.length === 0) { src.textContent = 'Data unavailable'; return; }
      renderChart(dates, prices);
    }

    load();
  </script>
</body>
</html>
