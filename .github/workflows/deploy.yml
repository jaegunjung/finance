name: Deploy Jekyll to GitHub Pages

on:
  push:
    branches: ["main"]
  # Bot commits (BTC/ETH/PEPE/macro/stocks/S&P500/news-watch/fetch-symbol) push using the
  # default GITHUB_TOKEN, and GitHub does not let GITHUB_TOKEN-authored pushes trigger other
  # push-based workflows — so without this, the site only redeploys after a human pushes from
  # a local machine. Re-trigger deploy whenever any of those automated workflows finishes, so
  # daily data/blog updates actually reach the live site.
  workflow_run:
    workflows:
      - "Update BTC Daily Data"
      - "Update ETH Daily Data"
      - "Update PEPE Daily Data"
      - "Update Macro Data (FRED)"
      - "Update Stock Daily Data"
      - "Update S&P 500 Data"
      - "Daily News Watch (Clarity Act / AI CapEx)"
      - "Fetch New Symbol Data"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: |
          echo "gdrive_api_key: ${GDRIVE_API_KEY}" > _config_secrets.yml
          echo "gdrive_client_id: ${GDRIVE_CLIENT_ID}" >> _config_secrets.yml
          # Not passing --baseurl here on purpose: steps.pages.outputs.base_path keeps resolving
          # to "/finance" for this repo even with the jjanalysis.com custom domain configured in
          # Pages settings, which silently overrode _config.yml's baseurl and broke every asset
          # path (CSS/JS/images all 404'd on the live site). _config.yml's baseurl: "" is now the
          # single source of truth — don't reintroduce a --baseurl flag here without re-verifying
          # base_path actually resolves to "" for this domain.
          bundle exec jekyll build --config _config.yml,_config_secrets.yml
        env:
          JEKYLL_ENV: production
          GDRIVE_API_KEY: ${{ secrets.GDRIVE_API_KEY }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
