name: Daily Newsletter Draft

on:
  schedule:
    - cron: '0 13 * * *'  # US Pacific 06:00 (PDT, UTC-7); drifts to 05:00 Pacific during PST (UTC-8)
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  newsletter-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need git history to find posts added in the last 24h

      # Deterministic gate: list deep-dive posts added to _posts/ in the last 24 hours.
      # Only posts with `deep_dive: true` in front matter (written by the site owner) are
      # emailed — bot-generated daily-news-watch posts never set it. A 24h window on a
      # daily cron means each post is picked up exactly once.
      - name: Detect new deep-dive posts
        id: posts
        run: |
          files=$(git log --since="24 hours ago" --diff-filter=A --name-only --pretty=format: -- '_posts/*.md' \
            | sort -u | while read -r f; do
                [ -n "$f" ] && [ -f "$f" ] || continue
                # look only inside the front matter block (between the first two '---' lines)
                if awk '/^---[[:space:]]*$/{n++; next} n==1' "$f" | grep -qE '^deep_dive:[[:space:]]*true[[:space:]]*$'; then
                  echo "$f"
                fi
              done)
          if [ -z "$files" ]; then
            echo "No new deep-dive posts in the last 24h — skipping newsletter."
            echo "has_posts=false" >> "$GITHUB_OUTPUT"
          else
            echo "New posts:"; echo "$files"
            echo "has_posts=true" >> "$GITHUB_OUTPUT"
            { echo "files<<EOF_FILES"; echo "$files"; echo "EOF_FILES"; } >> "$GITHUB_OUTPUT"
          fi

      - name: Send newsletter for new posts with Claude Code
        if: steps.posts.outputs.has_posts == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "Bash"
          prompt: |
            You are running a scheduled, unattended job that emails subscribers of this finance
            blog (https://jjanalysis.com) about deep-dive blog posts published in the last 24 hours.

            ## Step 1 — Read the new posts
            These post files were added to _posts/ in the last 24 hours (already detected for you —
            do not look for others, and do not use Google News or any outside news source):

            ${{ steps.posts.outputs.files }}

            Read each file. Use its front matter (title_ko / title_en / title, excerpt_ko /
            excerpt_en, categories, permalink) and its body.

            ## Step 2 — Build each post's URL
            The site permalink pattern is /:categories/:year/:month/:day/:title/ where :title is the
            filename slug after the date (e.g. _posts/2026-11-01-foo-bar.md with categories: macro →
            https://jjanalysis.com/macro/2026/11/01/foo-bar/). Multiple categories become nested
            path segments in order. If the post sets its own `permalink:`, use that instead.
            Verify each URL with `curl -s -o /dev/null -w "%{http_code}" <url>`. If it is not 200,
            use https://jjanalysis.com/blog/ as the link for that post instead.

            ## Step 3 — Write the email
            - Subject: Korean title of the post (if several posts, the most substantial one's
              Korean title plus " 외 N편")
            - Korean section FIRST: for each post, its Korean title, a 3-5 sentence Korean summary
              of the post's main points, and its jjanalysis.com link
            - English section SECOND: the same for each post in English
            - End with a short disclaimer in both languages: informational only, not investment
              advice
            - Summarize only what the post actually says — do not add facts, figures, or news that
              are not in the post

            ## Step 4 — Send via Buttondown
            Write the JSON payload to a file with a tool that handles escaping correctly (e.g.
            python3 -c with json.dump), then:

            curl -s -X POST https://api.buttondown.email/v1/emails \
              -H "Authorization: Token $BUTTONDOWN_API_KEY" \
              -H "Content-Type: application/json" \
              -d @payload.json

            with payload {"subject": "<subject>", "body": "<markdown body>", "status": "about_to_send"}.
            The BUTTONDOWN_API_KEY environment variable is provided below. Send exactly ONE email
            per run, even if there are several posts. If the API call fails, do not retry more
            than once.

            ## Step 5 — Log via a GitHub issue
            Open a GitHub issue (gh CLI is pre-authenticated) titled
            "Newsletter sent — <today's date>" listing the subject, the posts included with their
            links, and the Buttondown API response status (or the error if sending failed).

            Do not modify, commit, or push any files in this repository.
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          GH_TOKEN: ${{ github.token }}
