name: Update S&P 500 Data

on:
  schedule:
    - cron: '0 6 * * *'  # Every day at 06:00 UTC — script exits early if this month already done
  workflow_dispatch:       # Allow manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Run update script
        run: python scripts/update_sp500.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/sp500_monthly.csv
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Auto-update S&P 500 data [$(date +%Y-%m)]"
            git push
          fi
