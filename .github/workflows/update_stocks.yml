name: Update Stock Daily Data

on:
  schedule:
    - cron: '0 1 * * 1-6'  # Mon–Sat UTC 01:00
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-stocks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests yfinance

      - name: Sync new symbols from Supabase
        run: python scripts/sync_symbols.py
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Update stock CSVs
        run: python scripts/update_stocks.py
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}

      - name: Update SGOV annual total returns
        run: python scripts/update_sgov_returns.py
        # yfinance hits Yahoo Finance directly (no API key) — don't let a
        # transient failure there (rate limit, network hiccup) block the
        # stock-CSV commit above, which already succeeded independently.
        continue-on-error: true

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/ config/symbols.json stock/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Auto-update stock daily data [$(date +%Y-%m-%d)]"
            git pull --rebase origin main
            git push
          fi
