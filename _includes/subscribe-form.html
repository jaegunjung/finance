{% comment %}
  Buttondown subscribe form (dark theme). Used on the home hero and below posts.
  Each include gets a unique input id so multiple forms on one page don't clash.
{% endcomment %}
{% assign sf_id = include.id | default: "home" %}
<form
  action="https://buttondown.com/api/emails/embed-subscribe/{{ site.buttondown_username | default: 'jaegun' }}"
  method="post"
  class="embeddable-buttondown-form"
  style="background:#1a1a2e;color:#ffffff;border:1px solid #333;border-radius:8px;padding:16px;max-width:480px;margin:16px auto 0;text-align:left;"
>
  <label for="bd-email-{{ sf_id }}" style="display:block;font-weight:600;margin-bottom:8px;color:#ffffff;">
    매일 시장 업데이트 받기 / Get Daily Market Updates
  </label>
  <div style="display:flex;gap:8px;flex-wrap:wrap;">
    <input type="email" name="email" id="bd-email-{{ sf_id }}" required
      placeholder="이메일 주소를 입력하세요"
      style="flex:1 1 200px;min-width:0;background:#2a2a3e;color:#ffffff;border:1px solid #333;border-radius:6px;padding:10px 12px;font-size:14px;" />
    <input type="hidden" value="1" name="embed" />
    <input type="submit" value="구독하기 / Subscribe"
      style="background:#f5a623;color:#1a1a2e;border:none;border-radius:6px;padding:10px 16px;font-weight:700;font-size:14px;cursor:pointer;" />
  </div>
  <p style="margin:8px 0 0;font-size:12px;">
    <a href="https://buttondown.com/refer/{{ site.buttondown_username | default: 'jaegun' }}" target="_blank" rel="noopener" style="color:#a1a1aa;">
      Powered by Buttondown.
    </a>
  </p>
</form>
