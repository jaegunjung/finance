<div class="mini-chart-wrap" style="margin: 24px 0;">
  <div style="height:200px; background:var(--bg-card); border:1px solid var(--border); border-radius:8px; padding:16px;">
    <canvas id="miniCagrChart" style="width:100%;height:100%;touch-action:pan-y;"></canvas>
  </div>
  <p style="color:var(--text-muted);font-size:0.72rem;margin-top:4px;">
    <span class="en-only">S&amp;P 500 CAGR by phase (nominal) · <a href="{{ '/finance/' | relative_url }}" style="color:var(--text-muted);">Open interactive chart →</a></span>
    <span class="ko-only">S&amp;P 500 국면별 CAGR (명목) · <a href="{{ '/finance/' | relative_url }}" style="color:var(--text-muted);">인터랙티브 차트 열기 →</a></span>
  </p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
(function() {
  new Chart(document.getElementById('miniCagrChart').getContext('2d'), {
    type: 'bar',
    data: {
      labels: ['1956–1975','1975–1994','1994–2000','2000–2010','2010–present'],
      datasets: [{ data:[4,7,21,-3,13], backgroundColor:['rgba(63,185,80,0.55)','rgba(63,185,80,0.7)','rgba(59,139,212,0.8)','rgba(248,81,73,0.7)','rgba(59,139,212,0.7)'], borderRadius:4, borderSkipped:false }]
    },
    options: {
      indexAxis:'y', responsive:true, maintainAspectRatio:false, animation:false,
      plugins: { legend:{display:false}, tooltip:{ backgroundColor:'#1c2128', borderColor:'#30363d', borderWidth:1, titleColor:'#e6edf3', bodyColor:'#8b949e', displayColors:false, callbacks:{label:item=>`CAGR: ${item.raw>0?'+':''}${item.raw}%`} } },
      scales: {
        x:{ min:-6, max:25, grid:{color:'rgba(48,54,61,0.8)'}, ticks:{color:'#8b949e',font:{size:10},callback:v=>`${v}%`} },
        y:{ grid:{display:false}, ticks:{color:'#8b949e',font:{size:10}} }
      }
    }
  });
})();
</script>
