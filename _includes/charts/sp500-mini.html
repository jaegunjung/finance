<div class="mini-chart-wrap" style="margin: 24px 0;">
  <div style="position:relative; width:100%; height:300px; background:var(--bg-card); border:1px solid var(--border); border-radius:8px; overflow:hidden;">
    <canvas id="miniSp500Chart" style="position:absolute;top:0;left:0;width:100%;height:100%;"></canvas>
    <svg id="miniChannelSvg" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:visible;"></svg>
  </div>
  <p style="color:var(--text-muted);font-size:0.72rem;margin-top:4px;">
    <span class="en-only">S&amp;P 500 1927–present · Log scale · Trend channel · <a href="{{ '/finance/' | relative_url }}" style="color:var(--text-muted);">Open interactive chart →</a></span>
    <span class="ko-only">S&amp;P 500 1927–현재 · 로그 스케일 · 추세 채널 · <a href="{{ '/finance/' | relative_url }}" style="color:var(--text-muted);">인터랙티브 차트 열기 →</a></span>
  </p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
(function() {
  const SLOPE = 0.005371, UPPER_INT = 2.4372, LOWER_INT = 1.1128, CENTER_INT = (UPPER_INT + LOWER_INT) / 2;
  const channelPrice = (int, mn) => Math.exp(int + SLOPE * mn);

  fetch('{{ "/assets/data/sp500_monthly.csv" | relative_url }}')
    .then(r => r.text())
    .then(csv => {
      const rows = csv.trim().split('\n').slice(1);
      const dates = [], prices = [];
      rows.forEach(line => {
        const [d, p] = line.split(',');
        dates.push(d.trim());
        prices.push(parseFloat(p));
      });

      const ctx = document.getElementById('miniSp500Chart').getContext('2d');
      const overlayPlugin = {
        id: 'miniOverlay',
        afterDraw(ch) {
          const svg = document.getElementById('miniChannelSvg');
          const ca = ch.chartArea, xS = ch.scales.x, yS = ch.scales.y;
          const mn0 = xS.getValueForPixel(ca.left), mn1 = xS.getValueForPixel(ca.right);
          const x0 = ca.left, x1 = ca.right;
          const uY0 = yS.getPixelForValue(channelPrice(UPPER_INT, mn0)), uY1 = yS.getPixelForValue(channelPrice(UPPER_INT, mn1));
          const lY0 = yS.getPixelForValue(channelPrice(LOWER_INT, mn0)), lY1 = yS.getPixelForValue(channelPrice(LOWER_INT, mn1));
          const cY0 = yS.getPixelForValue(channelPrice(CENTER_INT, mn0)), cY1 = yS.getPixelForValue(channelPrice(CENTER_INT, mn1));
          svg.innerHTML = `
            <defs><clipPath id="mca"><rect x="${ca.left}" y="${ca.top}" width="${ca.right-ca.left}" height="${ca.bottom-ca.top}"/></clipPath></defs>
            <g clip-path="url(#mca)">
              <polygon points="${x0},${uY0} ${x1},${uY1} ${x1},${lY1} ${x0},${lY0}" fill="rgba(59,139,212,0.06)"/>
              <line x1="${x0}" y1="${uY0}" x2="${x1}" y2="${uY1}" stroke="#3B8BD4" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="6 4"/>
              <line x1="${x0}" y1="${lY0}" x2="${x1}" y2="${lY1}" stroke="#3B8BD4" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="6 4"/>
              <line x1="${x0}" y1="${cY0}" x2="${x1}" y2="${cY1}" stroke="#3B8BD4" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="2 4"/>
            </g>`;
        }
      };

      new Chart(ctx, {
        type: 'line',
        data: { datasets: [{ data: prices.map((p,i)=>({x:i,y:p})), borderColor:'#3B8BD4', borderWidth:1.2, pointRadius:0, tension:0, parsing:false }] },
        options: {
          responsive: true, maintainAspectRatio: false, animation: false,
          scales: {
            x: { type:'linear', min:0, max:dates.length-1, grid:{color:'rgba(48,54,61,0.6)'}, ticks:{ color:'#8b949e', font:{size:10}, maxTicksLimit:12, callback:(v)=>{ const i=Math.round(v); if(i<0||i>=dates.length) return ''; const d=dates[i]; return d&&d.slice(5)==='01'?d.slice(0,4):''; } } },
            y: { type:'logarithmic', grid:{color:'rgba(48,54,61,0.6)'}, ticks:{ color:'#8b949e', font:{size:10}, callback: v=>{ return [10,50,100,500,1000,5000].includes(v)?v.toLocaleString():''; } } }
          },
          plugins: { legend:{display:false}, tooltip:{enabled:false} }
        },
        plugins: [overlayPlugin]
      });
    });
})();
</script>
