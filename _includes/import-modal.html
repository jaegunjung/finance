<!-- Import Transactions Modal — hidden until triggered via "Import Trades" link -->
<div id="importModal" style="display:none; position:fixed; inset:0; z-index:9000; background:rgba(0,0,0,0.72); overflow-y:auto;">
  <div id="importModalBox" style="
    background:var(--bg-card); border:1px solid var(--border); border-radius:12px;
    max-width:680px; margin:48px auto; padding:28px; position:relative;
  ">
    <!-- Close -->
    <button onclick="importModalClose()" style="
      position:absolute; top:14px; right:16px; background:none; border:none;
      color:var(--text-muted); font-size:1.4rem; cursor:pointer; line-height:1;
    " title="Close">✕</button>

    <h2 style="margin:0 0 4px; color:var(--text-primary); font-size:1.1rem;">📥 Import Transactions</h2>
    <p style="color:var(--text-muted); font-size:0.82rem; margin:0 0 20px;">
      Upload a CSV from My Stocks Portfolio (MSP) app or any generic trade CSV.
    </p>

    <!-- Portfolio selector -->
    <div style="margin-bottom:16px;">
      <label style="display:block; font-size:0.8rem; color:var(--text-secondary); margin-bottom:6px; font-weight:600; text-transform:uppercase; letter-spacing:0.06em;">Portfolio</label>
      <div id="importPortfolioAutoNote" style="display:none; font-size:0.82rem; color:rgba(63,185,80,0.9); padding:6px 10px; background:rgba(63,185,80,0.08); border:1px solid rgba(63,185,80,0.25); border-radius:6px; margin-bottom:8px;"></div>
      <div id="importPortfolioSelWrap" style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
        <select id="importPortfolioSel" style="
          background:var(--bg-secondary); border:1px solid var(--border); border-radius:6px;
          color:var(--text-primary); padding:6px 10px; font-size:0.85rem; flex:1; min-width:160px;
        ">
          <option value="">— Select portfolio —</option>
        </select>
        <span style="color:var(--text-muted); font-size:0.8rem;">or</span>
        <input id="importNewPortfolio" type="text" placeholder="New portfolio name" style="
          background:var(--bg-secondary); border:1px solid var(--border); border-radius:6px;
          color:var(--text-primary); padding:6px 10px; font-size:0.85rem; flex:1; min-width:140px;
        ">
      </div>
    </div>

    <!-- Import source tabs -->
    <div style="display:flex; gap:6px; margin-bottom:14px;">
      <button id="importTabFile" onclick="importSwitchTab('file')" style="
        padding:6px 14px; border-radius:20px; border:1px solid var(--accent-blue);
        background:var(--accent-blue); color:#fff; font-size:0.8rem; cursor:pointer; font-weight:600;
      ">📄 Local File</button>
      <button id="importTabGdrive" onclick="importSwitchTab('gdrive')" style="
        padding:6px 14px; border-radius:20px; border:1px solid var(--border);
        background:none; color:var(--text-secondary); font-size:0.8rem; cursor:pointer;
      ">☁️ Google Drive</button>
    </div>

    <!-- File upload / drag-drop -->
    <div id="importPanelFile">
    <div id="importDropZone" style="
      border:2px dashed var(--border); border-radius:8px; padding:32px 20px;
      text-align:center; cursor:pointer; transition:border-color 0.2s, background 0.2s;
      background:var(--bg-secondary); margin-bottom:16px;
    "
      onclick="document.getElementById('importFileInput').click()"
      ondragover="importDragOver(event)"
      ondragleave="importDragLeave(event)"
      ondrop="importDrop(event)"
    >
      <div style="font-size:2rem; margin-bottom:8px;">📄</div>
      <div style="color:var(--text-secondary); font-size:0.88rem;">Drag &amp; drop a CSV file here, or <strong style="color:var(--accent-blue);">browse</strong></div>
      <div style="color:var(--text-muted); font-size:0.76rem; margin-top:4px;">Supports MSP export or any trade CSV with headers</div>
      <input id="importFileInput" type="file" accept=".csv,text/csv" style="display:none" onchange="importFileSelected(event)">
    </div>
    </div>

    <!-- Google Drive panel -->
    <div id="importPanelGdrive" style="display:none; margin-bottom:16px;">
      <div style="
        border:2px dashed var(--border); border-radius:8px; padding:32px 20px;
        text-align:center; background:var(--bg-secondary);
      ">
        <div style="font-size:2rem; margin-bottom:8px;">☁️</div>
        <div style="color:var(--text-secondary); font-size:0.88rem; margin-bottom:14px;">
          Google Drive에서 CSV 파일을 선택하세요
        </div>
        <button onclick="importGdriveOpen()" style="
          padding:9px 22px; border-radius:8px; border:none;
          background:#4285f4; color:#fff; font-size:0.88rem; font-weight:600;
          cursor:pointer; display:inline-flex; align-items:center; gap:8px;
        ">
          <svg width="18" height="18" viewBox="0 0 87.3 78" xmlns="http://www.w3.org/2000/svg">
            <path d="m6.6 66.85 3.85 6.65c.8 1.4 1.95 2.5 3.3 3.3l13.75-23.8h-27.5c0 1.55.4 3.1 1.2 4.5z" fill="#0066da"/>
            <path d="m43.65 25-13.75-23.8c-1.35.8-2.5 1.9-3.3 3.3l-25.4 44a9.06 9.06 0 0 0 -1.2 4.5h27.5z" fill="#00ac47"/>
            <path d="m73.55 76.8c1.35-.8 2.5-1.9 3.3-3.3l1.6-2.75 7.65-13.25c.8-1.4 1.2-2.95 1.2-4.5h-27.502l5.852 11.5z" fill="#ea4335"/>
            <path d="m43.65 25 13.75-23.8c-1.35-.8-2.9-1.2-4.5-1.2h-18.5c-1.6 0-3.15.45-4.5 1.2z" fill="#00832d"/>
            <path d="m59.8 53h-32.3l-13.75 23.8c1.35.8 2.9 1.2 4.5 1.2h50.8c1.6 0 3.15-.45 4.5-1.2z" fill="#2684fc"/>
            <path d="m73.4 26.5-12.7-22c-.8-1.4-1.95-2.5-3.3-3.3l-13.75 23.8 16.15 28h27.45c0-1.55-.4-3.1-1.2-4.5z" fill="#ffba00"/>
          </svg>
          Google Drive에서 선택
        </button>
        <div id="importGdriveStatus" style="margin-top:10px; font-size:0.78rem; color:var(--text-muted);"></div>
      </div>
    </div>

    <!-- Detected format badge + preview -->
    <div id="importPreviewArea" style="display:none;">
      <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap;">
        <span id="importFormatBadge" style="
          background:var(--accent-blue); color:#fff; font-size:0.72rem; font-weight:700;
          padding:2px 10px; border-radius:20px; letter-spacing:0.05em;
        ">MSP</span>
        <span id="importRowCount" style="color:var(--text-secondary); font-size:0.83rem;"></span>
        <span id="importWarnMsg" style="color:rgba(255,180,0,0.9); font-size:0.8rem;"></span>
      </div>

      <!-- Portfolio filter checkboxes (shown when CSV has Portfolio column) -->
      <div id="importPortfolioFilter" style="display:none; margin-bottom:12px;">
        <div style="font-size:0.75rem; font-weight:600; text-transform:uppercase; letter-spacing:0.07em; color:var(--text-muted); margin-bottom:8px;">
          가져올 포트폴리오 선택
        </div>
        <div id="importPortfolioCheckboxes" style="display:flex; flex-wrap:wrap; gap:8px;"></div>
        <div style="margin-top:6px; font-size:0.76rem; color:var(--text-muted);">
          <span id="importPortfolioFilterCount"></span>
        </div>
      </div>

      <!-- Preview table (first 10 rows) -->
      <div style="overflow-x:auto; border-radius:6px; border:1px solid var(--border);">
        <table id="importPreviewTable" style="
          width:100%; border-collapse:collapse; font-size:0.78rem; color:var(--text-secondary);
        ">
          <thead>
            <tr style="background:var(--bg-secondary);">
              <th style="padding:7px 10px; text-align:left; color:var(--text-muted); font-weight:600; white-space:nowrap;">Date</th>
              <th style="padding:7px 10px; text-align:left; color:var(--text-muted); font-weight:600;">Symbol</th>
              <th style="padding:7px 10px; text-align:left; color:var(--text-muted); font-weight:600;">Type</th>
              <th style="padding:7px 10px; text-align:right; color:var(--text-muted); font-weight:600;">Shares</th>
              <th style="padding:7px 10px; text-align:right; color:var(--text-muted); font-weight:600;">Price</th>
              <th style="padding:7px 10px; text-align:right; color:var(--text-muted); font-weight:600;">Amount</th>
              <th style="padding:7px 10px; text-align:left; color:var(--text-muted); font-weight:600;">Notes</th>
            </tr>
          </thead>
          <tbody id="importPreviewBody"></tbody>
        </table>
      </div>
    </div>

    <!-- Status message -->
    <div id="importStatus" style="display:none; margin-top:12px; padding:10px 14px; border-radius:6px; font-size:0.84rem;"></div>

    <!-- Action buttons -->
    <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px;">
      <button onclick="importModalClose()" style="
        padding:8px 20px; border-radius:6px; border:1px solid var(--border);
        background:none; color:var(--text-secondary); cursor:pointer; font-size:0.85rem;
      ">Cancel</button>
      <button id="importSubmitBtn" onclick="importSubmit()" style="
        padding:8px 20px; border-radius:6px; border:none;
        background:var(--accent-blue); color:#fff; cursor:pointer; font-size:0.85rem;
        font-weight:600; opacity:0.4; pointer-events:none;
      " disabled>Import</button>
    </div>
  </div>
</div>

<script>
// ── Import Modal State ──────────────────────────────────────────────────────
let _importParsed = null;  // { rows, format }
let _importTab = 'file';
let _gdrivePickerActive = false;

function importSwitchTab(tab) {
  _importTab = tab;
  document.getElementById('importPanelFile').style.display    = tab === 'file'    ? '' : 'none';
  document.getElementById('importPanelGdrive').style.display  = tab === 'gdrive'  ? '' : 'none';
  const tabFile   = document.getElementById('importTabFile');
  const tabGdrive = document.getElementById('importTabGdrive');
  const activeStyle   = 'padding:6px 14px;border-radius:20px;border:1px solid var(--accent-blue);background:var(--accent-blue);color:#fff;font-size:0.8rem;cursor:pointer;font-weight:600;';
  const inactiveStyle = 'padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:none;color:var(--text-secondary);font-size:0.8rem;cursor:pointer;';
  tabFile.style.cssText   = tab === 'file'   ? activeStyle : inactiveStyle;
  tabGdrive.style.cssText = tab === 'gdrive' ? activeStyle : inactiveStyle;
}

// ── Google Drive Picker ─────────────────────────────────────────────────────
// Requires Google API key + OAuth Client ID configured in window._GDRIVE_CONFIG
const _GDRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.readonly';
let _gdriveTokenClient = null;
let _gdriveAccessToken = null;
let _gdrivePickerLoaded = false;

function importGdriveLoadScripts(cb) {
  let pending = 2;
  function done() { if (--pending === 0) cb(); }
  if (!document.getElementById('_gapi_script')) {
    const s = document.createElement('script');
    s.id = '_gapi_script'; s.src = 'https://apis.google.com/js/api.js';
    s.onload = () => { gapi.load('picker', () => { _gdrivePickerLoaded = true; done(); }); };
    document.head.appendChild(s);
  } else {
    if (_gdrivePickerLoaded) done(); else gapi.load('picker', () => { _gdrivePickerLoaded = true; done(); });
  }
  if (!document.getElementById('_gis_script')) {
    const s = document.createElement('script');
    s.id = '_gis_script'; s.src = 'https://accounts.google.com/gsi/client';
    s.onload = done;
    document.head.appendChild(s);
  } else { done(); }
}

function importGdriveOpen() {
  const cfg = window._GDRIVE_CONFIG;
  if (!cfg || !cfg.apiKey || !cfg.clientId) {
    importGdriveSetStatus('⚠️ Google Drive 설정이 없습니다. 관리자에게 문의하세요.');
    return;
  }
  importGdriveSetStatus('Google 라이브러리 로딩 중…');
  importGdriveLoadScripts(() => {
    if (_gdriveAccessToken) {
      importGdriveShowPicker(cfg);
    } else {
      _gdriveTokenClient = google.accounts.oauth2.initTokenClient({
        client_id: cfg.clientId,
        scope: _GDRIVE_SCOPE,
        callback: (resp) => {
          if (resp.error) { importGdriveSetStatus('❌ Google 인증 실패: ' + resp.error); return; }
          _gdriveAccessToken = resp.access_token;
          importGdriveShowPicker(cfg);
        },
      });
      importGdriveSetStatus('Google 계정 로그인 중…');
      _gdriveTokenClient.requestAccessToken({ prompt: 'consent' });
    }
  });
}

function importGdriveShowPicker(cfg) {
  importGdriveSetStatus('Google Drive 파일 선택기 열기…');
  const view = new google.picker.DocsView()
    .setSelectFolderEnabled(false)
    .setIncludeFolders(true)
    .setOwnedByMe(true);
  _gdrivePickerActive = true;
  document.getElementById('importModal').style.visibility = 'hidden';
  const picker = new google.picker.PickerBuilder()
    .addView(view)
    .setOAuthToken(_gdriveAccessToken)
    .setDeveloperKey(cfg.apiKey)
    .setCallback(importGdrivePickerCallback)
    .build();
  picker.setVisible(true);
  importGdriveSetStatus('');
}

function importGdrivePickerCallback(data) {
  if (data.action === google.picker.Action.PICKED || data.action === google.picker.Action.CANCEL) {
    setTimeout(() => {
      _gdrivePickerActive = false;
      document.getElementById('importModal').style.visibility = '';
    }, 300);
  }
  if (data.action !== google.picker.Action.PICKED) return;
  const file = data.docs?.[0];
  if (!file) return;
  importGdriveSetStatus(`📥 다운로드 중: ${file.name}…`);
  fetch(`https://www.googleapis.com/drive/v3/files/${file.id}?alt=media`, {
    headers: { Authorization: 'Bearer ' + _gdriveAccessToken },
  })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(text => {
      importGdriveSetStatus(`✓ ${file.name} 로드 완료`);
      if (!window.txns) { importShowStatus('error', 'Transaction module not loaded.'); return; }
      _importParsed = window.txns.parseMspCsv(text);
      importRenderPreview(_importParsed);
    })
    .catch(e => importGdriveSetStatus('❌ 다운로드 실패: ' + e.message));
}

function importGdriveSetStatus(msg) {
  document.getElementById('importGdriveStatus').textContent = msg;
}

function importModalOpen() {
  document.getElementById('importModal').style.display = 'block';
  document.body.style.overflow = 'hidden';
  importLoadPortfolios();
}

function importModalClose() {
  document.getElementById('importModal').style.display = 'none';
  document.body.style.overflow = '';
  // Reset
  _importParsed = null;
  document.getElementById('importPreviewArea').style.display = 'none';
  document.getElementById('importStatus').style.display = 'none';
  document.getElementById('importFileInput').value = '';
  importSwitchTab('file');
  importGdriveSetStatus('');
  const btn = document.getElementById('importSubmitBtn');
  btn.disabled = true; btn.style.opacity = '0.4'; btn.style.pointerEvents = 'none';
  btn.textContent = 'Import';
}

// Close on backdrop click
document.getElementById('importModal').addEventListener('click', function(e) {
  if (_gdrivePickerActive) return;
  if (e.target === this) importModalClose();
});

let _existingPortfolios = [];  // cached from Supabase on modal open

async function importLoadPortfolios() {
  const sel = document.getElementById('importPortfolioSel');
  sel.innerHTML = '<option value="">— Select portfolio —</option>';
  if (!window.txns) return;
  try {
    _existingPortfolios = await window.txns.getPortfolios();
    for (const p of _existingPortfolios) {
      const opt = document.createElement('option');
      opt.value = p.id; opt.textContent = p.name;
      sel.appendChild(opt);
    }
    if (_existingPortfolios.length === 1) sel.value = _existingPortfolios[0].id;
  } catch(e) {
    _existingPortfolios = [];
  }
}

function importDragOver(e) {
  e.preventDefault();
  const dz = document.getElementById('importDropZone');
  dz.style.borderColor = 'var(--accent-blue)';
  dz.style.background  = 'rgba(88,166,255,0.06)';
}
function importDragLeave(e) {
  const dz = document.getElementById('importDropZone');
  dz.style.borderColor = 'var(--border)';
  dz.style.background  = 'var(--bg-secondary)';
}
function importDrop(e) {
  e.preventDefault();
  importDragLeave(e);
  const file = e.dataTransfer?.files?.[0];
  if (file) importParseFile(file);
}
function importFileSelected(e) {
  const file = e.target.files?.[0];
  if (file) importParseFile(file);
}

function importParseFile(file) {
  const reader = new FileReader();
  reader.onload = function(e) {
    const text = e.target.result;
    if (!window.txns) { importShowStatus('error', 'Transaction module not loaded.'); return; }
    _importParsed = window.txns.parseMspCsv(text);
    importRenderPreview(_importParsed);
  };
  reader.readAsText(file);
}

function importRenderPreview({ rows, format }) {
  document.getElementById('importPreviewArea').style.display = 'block';
  document.getElementById('importFormatBadge').textContent = format;
  document.getElementById('importRowCount').textContent =
    `${rows.length} row${rows.length !== 1 ? 's' : ''} detected`;

  const warnEl = document.getElementById('importWarnMsg');
  warnEl.textContent = '';

  // If CSV has portfolio_name column, hide manual selector and show auto-assign notice
  const hasPortCol = rows.some(r => r.portfolio_name);
  const portSelWrap = document.getElementById('importPortfolioSelWrap');
  const portAutoNote = document.getElementById('importPortfolioAutoNote');
  const portFilter = document.getElementById('importPortfolioFilter');

  if (hasPortCol) {
    if (portSelWrap) portSelWrap.style.display = 'none';
    if (portAutoNote) portAutoNote.style.display = 'none';
    const names = [...new Set(rows.map(r => r.portfolio_name).filter(Boolean))].sort();
    const cbWrap = document.getElementById('importPortfolioCheckboxes');
    cbWrap.innerHTML = '';

    for (const name of names) {
      const count = rows.filter(r => r.portfolio_name === name).length;
      // Case-insensitive match against existing portfolios
      const matched = _existingPortfolios.find(p => p.name.toLowerCase() === name.toLowerCase());

      const row = document.createElement('div');
      row.style.cssText = 'display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg-secondary);';

      // Build options for mapping dropdown
      const existingOpts = _existingPortfolios.map(p =>
        `<option value="${p.id}" ${matched && matched.id === p.id ? 'selected' : ''}>${p.name}</option>`
      ).join('');

      row.innerHTML = `
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;">
          <input type="checkbox" checked class="import-port-cb" data-port-name="${name.replace(/"/g,'&quot;')}"
            onchange="importPortFilterChange()" style="accent-color:var(--accent-blue);cursor:pointer;">
          <span style="font-weight:600;font-size:0.85rem;">${name}</span>
          <span style="color:var(--text-muted);font-size:0.75rem;">(${count}건)</span>
        </label>
        <div style="display:flex;align-items:center;gap:6px;font-size:0.78rem;color:var(--text-muted);">
          <span>→ 매핑:</span>
          <select class="import-port-map" data-port-name="${name.replace(/"/g,'&quot;')}"
            onchange="importPortFilterChange()" style="background:var(--bg-card);border:1px solid var(--border);border-radius:6px;color:var(--text-primary);padding:3px 8px;font-size:0.8rem;">
            <option value="new" ${!matched ? 'selected' : ''}>(신규 생성: "${name}")</option>
            ${existingOpts}
          </select>
        </div>
        <span class="import-port-badge" style="font-size:0.7rem;padding:2px 8px;border-radius:10px;background:${matched ? 'rgba(63,185,80,0.12)' : 'rgba(88,166,255,0.12)'};color:${matched ? 'rgba(63,185,80,0.9)' : 'rgba(88,166,255,0.9)'};white-space:nowrap;">
          ${matched ? '✓ 매핑됨' : '+ 신규'}
        </span>
      `;
      cbWrap.appendChild(row);
    }
    if (portFilter) portFilter.style.display = '';
    importPortFilterChange();
  } else {
    if (portSelWrap) portSelWrap.style.display = '';
    if (portAutoNote) portAutoNote.style.display = 'none';
    if (portFilter) portFilter.style.display = 'none';
    importUpdateSubmitBtn(rows.length);
  }

  const tbody = document.getElementById('importPreviewBody');
  tbody.innerHTML = '';

  const preview = rows.slice(0, 10);
  const fmtN = n => n != null ? Number(n).toLocaleString(undefined, { maximumFractionDigits: 4 }) : '—';
  const fmtAmt = n => n != null ? '$' + Number(n).toLocaleString(undefined, { maximumFractionDigits: 2 }) : '—';

  for (const r of preview) {
    const tr = document.createElement('tr');
    tr.style.borderTop = '1px solid var(--border)';
    const typeColor = r.type === 'buy' ? 'rgba(63,185,80,0.9)' : 'rgba(248,81,73,0.9)';
    tr.innerHTML = `
      <td style="padding:6px 10px; white-space:nowrap;">${r.trade_date || '—'}</td>
      <td style="padding:6px 10px; font-weight:600; color:var(--text-primary);">${r.symbol || '—'}</td>
      <td style="padding:6px 10px; color:${typeColor}; font-weight:700; text-transform:uppercase; font-size:0.74rem;">${r.type || '—'}</td>
      <td style="padding:6px 10px; text-align:right;">${fmtN(r.shares)}</td>
      <td style="padding:6px 10px; text-align:right;">${fmtAmt(r.price)}</td>
      <td style="padding:6px 10px; text-align:right; color:var(--text-primary); font-weight:600;">${fmtAmt(r.amount)}</td>
      <td style="padding:6px 10px; color:var(--text-muted); max-width:140px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${r.notes || ''}</td>
    `;
    tbody.appendChild(tr);
  }

  if (rows.length > 10) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td colspan="7" style="padding:6px 10px; color:var(--text-muted); font-style:italic; text-align:center;">…and ${rows.length - 10} more rows</td>`;
    tbody.appendChild(tr);
  }

  if (!hasPortCol) {
    if (rows.length === 0) importShowStatus('error', 'No valid rows found. Check that your CSV has Date, Type, and Amount columns.');
  }
}

function importPortFilterChange() {
  if (!_importParsed) return;
  const checked = new Set(
    [...document.querySelectorAll('.import-port-cb:checked')].map(c => c.dataset.portName)
  );
  // Update badges when mapping dropdown changes
  document.querySelectorAll('.import-port-map').forEach(sel => {
    const badge = sel.closest('div').parentElement.querySelector('.import-port-badge');
    if (!badge) return;
    const isNew = sel.value === 'new';
    badge.textContent = isNew ? '+ 신규' : '✓ 매핑됨';
    badge.style.background = isNew ? 'rgba(88,166,255,0.12)' : 'rgba(63,185,80,0.12)';
    badge.style.color = isNew ? 'rgba(88,166,255,0.9)' : 'rgba(63,185,80,0.9)';
  });
  const filtered = _importParsed.rows.filter(r => !r.portfolio_name || checked.has(r.portfolio_name));
  const countEl = document.getElementById('importPortfolioFilterCount');
  if (countEl) countEl.textContent = `선택된 행: ${filtered.length} / ${_importParsed.rows.length}`;
  importUpdateSubmitBtn(filtered.length);
}

function importUpdateSubmitBtn(count) {
  const btn = document.getElementById('importSubmitBtn');
  if (count > 0) {
    btn.disabled = false; btn.style.opacity = '1'; btn.style.pointerEvents = '';
    btn.textContent = `Import ${count} row${count !== 1 ? 's' : ''}`;
  } else {
    btn.disabled = true; btn.style.opacity = '0.4'; btn.style.pointerEvents = 'none';
    btn.textContent = 'Import';
  }
}

async function importSubmit() {
  if (!_importParsed || !_importParsed.rows.length) return;
  if (!window.txns) { importShowStatus('error', 'Module not ready.'); return; }

  const btn = document.getElementById('importSubmitBtn');
  btn.disabled = true; btn.textContent = 'Importing…';

  // Resolve portfolio
  let portfolioId = document.getElementById('importPortfolioSel').value || null;
  const newName = document.getElementById('importNewPortfolio').value.trim();
  if (!portfolioId && newName) {
    try {
      const p = await window.txns.createPortfolio(newName);
      portfolioId = p.id;
      document.getElementById('importNewPortfolio').value = '';
    } catch(e) {
      importShowStatus('error', 'Failed to create portfolio: ' + e.message);
      btn.disabled = false; btn.textContent = `Import ${_importParsed.rows.length} rows`;
      return;
    }
  }

  // Build portfolio mapping from checkboxes + mapping dropdowns
  const checkedPorts = new Set(
    [...document.querySelectorAll('.import-port-cb:checked')].map(c => c.dataset.portName)
  );
  // Always include split rows for any symbol that has a transaction being imported
  // (splits are global — they apply regardless of which portfolio holds the stock)
  const nonSplitRows = checkedPorts.size > 0
    ? _importParsed.rows.filter(r => r.type !== 'split' && (!r.portfolio_name || checkedPorts.has(r.portfolio_name)))
    : _importParsed.rows.filter(r => r.type !== 'split');
  const importedSymbols = new Set(nonSplitRows.map(r => r.symbol).filter(Boolean));
  const splitRows = _importParsed.rows.filter(r => r.type === 'split' && importedSymbols.has(r.symbol));
  const rowsToImport = [...nonSplitRows, ...splitRows];

  // nameToId: csvName → existing portfolio id OR 'new'
  const nameToId = {};
  document.querySelectorAll('.import-port-map').forEach(sel => {
    const csvName = sel.dataset.portName;
    if (checkedPorts.has(csvName)) nameToId[csvName] = sel.value; // uuid or 'new'
  });

  try {
    const { imported, skipped } = await window.txns.importTransactions(rowsToImport, portfolioId, nameToId);
    const skipMsg = skipped > 0 ? ` (${skipped} duplicate${skipped !== 1 ? 's' : ''} skipped)` : '';
    importShowStatus('success', `✓ Successfully imported ${imported} transaction${imported !== 1 ? 's' : ''}.${skipMsg}`);
    btn.textContent = 'Done!';
    // Refresh chart txns if on a stock page
    if (window.SYMBOL && window.txns.loadChartTransactions) {
      window.txns.loadChartTransactions(window.SYMBOL);
    }
    // Refresh portfolio dropdown if on portfolio page
    if (typeof portLoadPortfolios === 'function') {
      await portLoadPortfolios();
      portSwitchView(portActiveView);
    }
    setTimeout(() => importModalClose(), 2200);
  } catch(e) {
    importShowStatus('error', 'Import failed: ' + e.message);
    btn.disabled = false;
    btn.textContent = `Import ${_importParsed.rows.length} rows`;
  }
}

function importShowStatus(type, msg) {
  const el = document.getElementById('importStatus');
  el.style.display = 'block';
  el.style.background = type === 'success' ? 'rgba(63,185,80,0.12)' : 'rgba(248,81,73,0.12)';
  el.style.color = type === 'success' ? 'rgba(63,185,80,0.95)' : 'rgba(248,81,73,0.95)';
  el.style.border = type === 'success' ? '1px solid rgba(63,185,80,0.3)' : '1px solid rgba(248,81,73,0.3)';
  el.textContent = msg;
}
</script>
