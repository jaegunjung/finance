<!-- Bookmark prompt (home page). Dismissal is remembered per browser in localStorage
     ('jj-bookmark-banner-dismissed'); if storage is unavailable it simply shows again. -->
<div id="bookmarkBanner" class="bookmark-banner" role="region" aria-label="Bookmark this site">
  <span class="bookmark-banner-text">
    📌
    <span class="en-only">Bookmark this site for daily market updates</span>
    <span class="ko-only">즐겨찾기 추가하고 매일 시장 업데이트 받기</span>
    <kbd id="bookmarkBannerKey" class="bookmark-banner-key">Ctrl+D</kbd>
  </span>
  <a href="#newsletter" class="bookmark-banner-link">
    <span class="en-only">or get it by email →</span><span class="ko-only">이메일로 받기 →</span>
  </a>
  <button type="button" class="bookmark-banner-close" onclick="jjDismissBookmarkBanner()"
    aria-label="Close" data-aria-label-en="Close" data-aria-label-ko="닫기">✕</button>
</div>
<script>
  (function () {
    var KEY = 'jj-bookmark-banner-dismissed';
    var el = document.getElementById('bookmarkBanner');
    var dismissed = false;
    try { dismissed = localStorage.getItem(KEY) === '1'; } catch (e) {}
    if (dismissed) { el.remove(); return; }
    if (/Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent)) {
      document.getElementById('bookmarkBannerKey').textContent = '⌘D';
    }
    window.jjDismissBookmarkBanner = function () {
      try { localStorage.setItem(KEY, '1'); } catch (e) {}
      el.remove();
    };
  })();
</script>
