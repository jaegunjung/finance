<section class="newsletter-section">
  <div class="newsletter-inner">
    <div class="newsletter-text">
      <p class="newsletter-title">
        <span class="en-only">Stay ahead of the market</span>
        <span class="ko-only">마켓을 한발 앞서가세요</span>
      </p>
      <p class="newsletter-desc">
        <span class="en-only">Get long-term analysis on S&amp;P 500, Bitcoin &amp; macro indicators — straight to your inbox. No noise, just signal.</span>
        <span class="ko-only">S&amp;P 500·비트코인·매크로 지표의 장기 분석을 이메일로 받아보세요. 노이즈 없이, 핵심만.</span>
      </p>
    </div>
    <form
      action="https://buttondown.com/api/emails/embed-subscribe/YOUR_BUTTONDOWN_USERNAME"
      method="post"
      target="popupwindow"
      onsubmit="window.open('https://buttondown.com/YOUR_BUTTONDOWN_USERNAME','popupwindow')"
      class="newsletter-form"
    >
      <input type="hidden" name="tag" value="finance-blog">
      <div class="newsletter-row">
        <input
          type="email"
          name="email"
          required
          placeholder="your@email.com"
          class="newsletter-input"
        >
        <button type="submit" class="newsletter-btn">
          <span class="en-only">Subscribe</span>
          <span class="ko-only">구독하기</span>
        </button>
      </div>
      <p class="newsletter-fine">
        <span class="en-only">Free · Unsubscribe anytime · Powered by Buttondown</span>
        <span class="ko-only">무료 · 언제든 구독 취소 · Buttondown 제공</span>
      </p>
    </form>
  </div>
</section>
