<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <script>
    // Apply saved language before first paint to avoid flash
    (function() {
      const lang = localStorage.getItem('jj-lang') || 'en';
      if (lang === 'ko') document.documentElement.classList.add('ko-mode');
      window.setLang = function(l) {
        localStorage.setItem('jj-lang', l);
        document.documentElement.classList.toggle('ko-mode', l === 'ko');
        document.querySelectorAll('[data-lang-btn]').forEach(function(btn) {
          btn.classList.toggle('active', btn.dataset.langBtn === l);
        });
      };
    })();
  </script>
</head>
<body>
  {% include nav.html %}
  <main>
    {{ content }}
  </main>
  {% include footer.html %}
  <script>
    // Sync lang buttons after DOM is ready
    document.addEventListener('DOMContentLoaded', function() {
      const lang = localStorage.getItem('jj-lang') || 'en';
      document.querySelectorAll('[data-lang-btn]').forEach(function(btn) {
        btn.classList.toggle('active', btn.dataset.langBtn === lang);
      });
    });
  </script>
</body>
</html>
