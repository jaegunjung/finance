<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <script>
    // Apply saved language before first paint to avoid flash
    (function() {
      const lang = localStorage.getItem('jj-lang') || 'en';
      if (lang === 'ko') document.documentElement.classList.add('ko-mode');
      window.setLang = function(l) {
        localStorage.setItem('jj-lang', l);
        document.documentElement.classList.toggle('ko-mode', l === 'ko');
        // Single toggle button: show opposite language as the label
        var btn = document.getElementById('langToggleBtn');
        if (btn) btn.textContent = l === 'ko' ? 'EN' : '한';
      };
    window.toggleLang = function() {
        var current = localStorage.getItem('jj-lang') || 'en';
        setLang(current === 'ko' ? 'en' : 'ko');
      };
    })();
  </script>
</head>
<body>
  {% include nav.html %}
  <main>
    {{ content }}
  </main>
  {% include footer.html %}
  <!-- Supabase SDK (site-wide: avatar, comments, profile) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="{{ '/assets/js/auth.js' | relative_url }}"></script>
  <script>
    // Sync lang buttons after DOM is ready
    document.addEventListener('DOMContentLoaded', function() {
      const lang = localStorage.getItem('jj-lang') || 'en';
      var btn = document.getElementById('langToggleBtn');
      if (btn) btn.textContent = lang === 'ko' ? 'EN' : '한';
    });
  </script>
</body>
</html>
