<!DOCTYPE html>
<html lang="en">
<head>
  {%- if page.legacy_finance_redirect %}
  <script>
    // 404.html only: pre-2026-08 links used the /finance/ prefix (jjanalysis.com/finance/crypto/).
    // Strip it and keep query/hash (UTM tags). The landing page reports it to GA (below).
    (function () {
      var p = location.pathname;
      if (/^\/finance(\/|$)/.test(p)) {
        try { sessionStorage.setItem('jj-legacy-from', p); } catch (e) {}
        location.replace((p.replace(/^\/finance/, '') || '/') + location.search + location.hash);
      }
    })();
  </script>
  {%- endif %}
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-891NY0LEMR"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-891NY0LEMR');
    (function () {
      try {
        var from = sessionStorage.getItem('jj-legacy-from');
        if (from) { sessionStorage.removeItem('jj-legacy-from'); gtag('event', 'legacy_finance_redirect', { from_path: from }); }
      } catch (e) {}
      // GA4 counts engagement time only when it gets a user_engagement hit on page hide, which
      // in-app browsers (LinkedIn, KakaoTalk) often never send when the user closes the webview —
      // so real reads can show up as 0s. These timers give a signal that doesn't depend on that.
      [10, 30].forEach(function (s) {
        setTimeout(function () {
          if (document.visibilityState === 'visible') gtag('event', 'time_on_page', { seconds: s });
        }, s * 1000);
      });
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% include seo.html %}
  <link rel="icon" type="image/png" href="{{ '/assets/images/jj-logo.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <script>
    // i18n: language lives in localStorage('jj-lang'), default 'en'; <html class="ko-mode"> drives CSS.
    //  - Static markup: <span class="en-only">…</span><span class="ko-only">…</span>
    //  - Attributes:    data-title-en/-ko, data-placeholder-en/-ko, data-aria-label-en/-ko
    //                   (applied on load and on every toggle by jjApplyI18nAttrs)
    //  - JS strings:    jjT('English', '한국어') for textContent/alert/confirm,
    //                   jjTT('English', '한국어') for innerHTML (emits both spans, so it re-toggles live)
    //  - Re-render:     listen for the 'jj:langchange' event on document
    (function() {
      var lang = 'en';
      try { lang = localStorage.getItem('jj-lang') || 'en'; } catch (e) {}
      if (lang === 'ko') document.documentElement.classList.add('ko-mode');
      document.documentElement.lang = lang === 'ko' ? 'ko' : 'en';
      window.jjIsKo = function() { return document.documentElement.classList.contains('ko-mode'); };
      window.jjT = function(en, ko) { return window.jjIsKo() ? ko : en; };
      window.jjTT = function(en, ko) { return '<span class="en-only">' + en + '</span><span class="ko-only">' + ko + '</span>'; };
      window.jjApplyI18nAttrs = function(root) {
        var ko = window.jjIsKo();
        ['title', 'placeholder', 'aria-label'].forEach(function(a) {
          (root || document).querySelectorAll('[data-' + a + '-en]').forEach(function(el) {
            var v = el.getAttribute('data-' + a + (ko ? '-ko' : '-en'));
            if (v != null) el.setAttribute(a, v);
          });
        });
      };
      window.setLang = function(l) {
        try { localStorage.setItem('jj-lang', l); } catch (e) {}
        document.documentElement.classList.toggle('ko-mode', l === 'ko');
        document.documentElement.lang = l === 'ko' ? 'ko' : 'en';
        // Single toggle button: show opposite language as the label
        var btn = document.getElementById('langToggleBtn');
        if (btn) btn.textContent = l === 'ko' ? 'EN' : '한';
        window.jjApplyI18nAttrs();
        document.dispatchEvent(new CustomEvent('jj:langchange', { detail: l }));
      };
    window.toggleLang = function() {
        var current = localStorage.getItem('jj-lang') || 'en';
        setLang(current === 'ko' ? 'en' : 'ko');
      };
    })();
  </script>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8581073892496440"
       crossorigin="anonymous"></script>
</head>
<body>
  <!-- Supabase SDK (218KB). `defer` so it no longer blocks first paint of every page — it was
       parser-blocking at the top of <body>, so on a phone over cellular nothing (not even the nav)
       rendered until it downloaded. Deferred scripts run in document order before DOMContentLoaded,
       so its consumers (comments.js, auth.js, transactions.js) are deferred too and still run after
       it. Pinned to the version @2 resolved to (2026-10) so the CDN serves it with a 1-year cache. -->
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script>
  {% include nav.html %}
  <main>
    {{ content }}
    {% include next-reads.html %}
  </main>
  {% include footer.html %}
  {% include import-modal.html %}
  {% include api-key-modal.html %}
  {% include tooltip.html %}
  <script>
    window._GDRIVE_CONFIG = {
      apiKey:   "{{ site.gdrive_api_key }}",
      clientId: "{{ site.gdrive_client_id }}"
    };
  </script>
  <script defer src="{{ '/assets/js/utm-handler.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
  <script defer src="{{ '/assets/js/auth.js' | relative_url }}"></script>
  <script defer src="{{ '/assets/js/transactions.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
  <script>
    // Sync lang buttons after DOM is ready
    document.addEventListener('DOMContentLoaded', function() {
      const lang = localStorage.getItem('jj-lang') || 'en';
      var btn = document.getElementById('langToggleBtn');
      if (btn) btn.textContent = lang === 'ko' ? 'EN' : '한';
      window.jjApplyI18nAttrs();
    });
  </script>
</body>
</html>
