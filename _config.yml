title: JJ Financial Analysis
description: S&P 500, Bitcoin & Market Analysis
# Suffix for <title> / og:title ("<page> | JJ Analysis") — see _includes/seo.html
seo_brand: "JJ Analysis"
baseurl: ""
url: "https://jjanalysis.com"

# Default link-preview image (og:image / twitter:image). Posts override with front matter `image:`.
# Must be PNG/JPG — LinkedIn, KakaoTalk and X ignore SVG. Regenerate: python scripts/generate_og_images.py
og_image: /assets/images/jj-og-default.png
og_image_alt: "JJ International Financial Analysis"
permalink: /:categories/:year/:month/:day/:title/
markdown: kramdown
theme: null
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

# Buttondown newsletter username (not secret — just the public embed-subscribe slug)
buttondown_username: "jaegun"

# Kakao JavaScript key for the 수익률 공유 KakaoTalk button (_includes/return-share.html).
# Public by design (domain-restricted in Kakao Developers → 플랫폼 → Web 사이트 도메인).
# Unset → placeholder, and the button shows "앱키 미설정" instead of sharing.
kakao_js_key: "29c46537d08e79ac3806467ad3030669"

# Google Drive Picker — injected via GitHub Secrets in CI (deploy.yml)
# For local dev, create _config_local.yml with these values (gitignored)

# Front matter defaults.
#  - lastmod_from_build: chart pages whose content is the daily-updated data in assets/data,
#    so sitemap <lastmod> = build time (deploys are triggered by the data-update workflows).
#    Everything else gets <lastmod> from git history (_plugins/last_modified.rb).
#  - Login-only and iframe-only pages: excluded from sitemap.xml and marked noindex.
defaults:
  - scope: { path: "index.html" }
    values: { lastmod_from_build: true }
  - scope: { path: "stock" }
    values: { lastmod_from_build: true }
  - scope: { path: "crypto" }
    values: { lastmod_from_build: true }
  - scope: { path: "macro" }
    values: { lastmod_from_build: true }
  - scope: { path: "rates" }
    values: { lastmod_from_build: true }
  - scope: { path: "portfolio" }
    values: { sitemap: false, noindex: true }
  - scope: { path: "profile" }
    values: { sitemap: false, noindex: true }
  - scope: { path: "crypto/embed-chart.html" }
    values: { sitemap: false }
  - scope: { path: "crypto/btc-mini-chart.html" }
    values: { sitemap: false }
