---
layout: default
title: Blog
---
<div style="padding: 32px 0 20px;">
  <h1>분석 블로그</h1>
  <p style="color:var(--text-secondary); margin-top:6px;">S&P 500 · 시장 역사 · 투자 인사이트</p>
</div>

<ul class="post-list">
  {% for post in site.posts %}
  <li class="post-item">
    <a href="{{ post.url }}">
      <div class="post-meta">
        <span>{{ post.date | date: "%Y-%m-%d" }}</span>
        {% for cat in post.categories %}
          <span class="badge badge-{{ cat }}">{{ cat }}</span>
        {% endfor %}
      </div>
      <h3>{{ post.title }}</h3>
      <p class="post-excerpt">{{ post.excerpt | strip_html | truncate: 150 }}</p>
    </a>
  </li>
  {% endfor %}
</ul>
